# ==============================================================================
# GESCOM — déploiement
#
#     cp .env.example .env    puis renseigner les secrets
#     chmod 600 .env
#     docker compose up -d --build
#
# Trois services sur un réseau interne. Seul `web` publie des ports : ni l'API
# ni PostgreSQL ne sont joignables depuis l'extérieur de la machine, les deux ne
# répondent qu'à travers le frontal.
#
# Sur la machine hôte, n'ouvrir que 22, 80 et 443 au pare-feu.
#
# Le domaine de service n'est écrit nulle part dans les fichiers versionnés : il
# vient de APP_DOMAIN (.env) et alimente à la fois le bloc de site du Caddyfile
# et l'origine CORS de l'API. Déployer ailleurs ne demande donc pas de modifier
# un fichier suivi en dépôt, et les deux valeurs ne peuvent plus diverger.
# ==============================================================================

# Journaux des conteneurs : sans plafond, le pilote json-file écrit indéfiniment
# dans /var/lib/docker et finit par remplir le disque de la machine hôte. Cinq
# fichiers de 10 Mio bornent chaque service à 50 Mio.
x-journalisation: &journalisation
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:

  # ----------------------------------------------------------------------------
  # Base de données
  #
  # Aucune section `ports:` — c'est volontaire. Publier 5432 exposerait la base
  # à tout l'Internet ; les autres conteneurs l'atteignent par le réseau interne
  # sous le nom d'hôte `db`. Pour une session psql : `docker compose exec db psql`.
  # ----------------------------------------------------------------------------
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    logging: *journalisation
    networks:
      - interne

  # ----------------------------------------------------------------------------
  # API Spring Boot
  #
  # depends_on avec `service_healthy` et non le simple ordre de démarrage :
  # Flyway attaque la base dès le boot et `ddl-auto=validate` fait échouer le
  # démarrage si le schéma n'est pas là. Attendre que PostgreSQL accepte
  # réellement les connexions évite un premier lancement en échec.
  # ----------------------------------------------------------------------------
  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # L'hôte est le nom du service, pas localhost : chaque conteneur a sa
      # propre pile réseau.
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      # Compte propriétaire du SaaS, créé au premier démarrage puis jamais
      # réécrit. Sans ces variables, aucun compte n'est créé.
      PLATFORM_ADMIN_USERNAME: ${PLATFORM_ADMIN_USERNAME:-}
      PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL:-}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD:-}
      # Une seule origine, celle du frontal. Le SPA étant servi sous ce même
      # domaine, cette valeur ne sert qu'aux éventuels appels hors navigateur.
      CORS_ORIGINS: https://${APP_DOMAIN}
      STRIPE_MODE: ${STRIPE_MODE:-simulated}
      STRIPE_API_KEY: ${STRIPE_API_KEY:-sk_test_fictive_key_for_simulation}
      STRIPE_CURRENCY: ${STRIPE_CURRENCY:-eur}
    # Le port n'est ouvert qu'une fois le contexte Spring rafraîchi, donc après
    # les migrations Flyway : le voir répondre vaut « application démarrée », pas
    # seulement « conteneur lancé ». La sonde passe par bash et son /dev/tcp car
    # l'image ne contient ni curl ni wget, et le /bin/sh d'Ubuntu (dash) ne sait
    # pas ouvrir de socket — d'où CMD et non CMD-SHELL.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8085"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    security_opt:
      - no-new-privileges:true
    logging: *journalisation
    networks:
      - interne

  # ----------------------------------------------------------------------------
  # Frontal web (Caddy + SPA compilé)
  #
  # Le volume `caddy-data` est indispensable : il conserve les certificats et la
  # clé de compte ACME. Sans lui, chaque redémarrage redemande un certificat à
  # Let's Encrypt et finit par heurter les quotas d'émission.
  #
  # `service_started` et non `service_healthy` : le frontal ne doit dépendre de
  # la santé de l'API en aucune façon. Attendre qu'elle soit saine fermerait bien
  # la fenêtre de 502 au démarrage, mais au prix d'un couplage inacceptable — une
  # migration Flyway en échec empêcherait Caddy de prendre les ports, donc de
  # servir le SPA *et* de répondre à la validation ACME. Une API cassée doit
  # dégrader /api en 502, pas éteindre le site et bloquer le renouvellement du
  # certificat. La fenêtre de 502 existe de toute façon après un redémarrage de
  # la machine, où `restart: unless-stopped` relance les trois conteneurs sans
  # tenir compte de depends_on.
  # ----------------------------------------------------------------------------
  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    environment:
      # Lues par le Caddyfile sous la forme {$VARIABLE}. APP_DOMAIN y est le nom
      # du bloc de site : sans valeur, Caddy refuse de démarrer plutôt que de
      # servir l'application sous un nom inattendu.
      APP_DOMAIN: ${APP_DOMAIN}
      # Le repli est posé ici et pas seulement dans le Caddyfile : cette ligne
      # *définit* toujours la variable dans le conteneur, à vide si .env ne la
      # renseigne pas, et {$VAR:defaut} de Caddy ne substitue son défaut que
      # lorsque la variable est absente — pas lorsqu'elle est présente et vide.
      # Sans ce ${VAR:-defaut}, le chemin documenté produit un `email` sans
      # argument.
      ACME_EMAIL: ${ACME_EMAIL:-mackaldine22@gmail.com}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
      - caddy-logs:/var/log/caddy
    logging: *journalisation
    networks:
      - interne

networks:
  interne:
    driver: bridge

volumes:
  db-data:
  caddy-data:
  caddy-config:
  caddy-logs:
