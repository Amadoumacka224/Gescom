# ==============================================================================
# GESCOM - intégration continue
#
# Ce fichier existe d'abord pour rendre vraie une affirmation qui ne l'était pas :
# le Dockerfile déclare que les tests « tournent au poste de développement et en
# intégration continue (mvn clean install) », alors qu'aucune intégration
# continue n'existait. La commande ci-dessous est donc littéralement celle citée.
#
# Deux tâches indépendantes, une par application du dépôt. Elles sont séparées
# pour que l'échec de l'une n'empêche pas de connaître le sort de l'autre : voir
# d'un coup d'œil que le backend passe et que le frontend casse, c'est la moitié
# du diagnostic.
#
# AUCUNE BASE DE DONNÉES N'EST NÉCESSAIRE, et ce n'est pas un hasard : les tests
# d'intégration (cloisonnement, cohérence du tableau de bord) tournent sur H2 en
# mémoire. Le choix d'écarter Testcontainers se paie ici en simplicité - pas de
# service PostgreSQL à démarrer, pas de démon Docker à supposer disponible.
# ==============================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Une série de poussées rapides n'a pas à faire tourner la CI sur chaque état
# intermédiaire : seule la dernière compte. Les exécutions déjà lancées sur la
# même branche sont annulées.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: API - tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Java 17, la version déclarée par le pom et employée par l'image d'exécution.
      # `cache: maven` conserve le dépôt local entre deux exécutions : sans lui,
      # chaque build retélécharge Spring Boot en entier.
      - name: Installer le JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # La commande citée par le Dockerfile : compilation, tests, et production du
      # jar. Lancée par le wrapper, pour que la version de Maven soit celle fixée
      # dans .mvn/wrapper et non celle du runner. `-B` pour un journal lisible hors
      # terminal interactif.
      - name: Compiler et tester
        run: ./mvnw -B clean install

      # Conservé même quand tout passe : le rapport JaCoCo est le seul endroit où
      # la couverture se lit, et l'ouvrir après coup évite de rejouer le build.
      - name: Publier le rapport de couverture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-jacoco
          path: target/site/jacoco/
          if-no-files-found: ignore

  # Les tests ci-dessus tournent sur H2, dont le schéma est dérivé des entités :
  # aucun script Flyway n'y est joué. Cette tâche comble le trou. Elle rejoue les
  # migrations sur un PostgreSQL vierge, de la même version qu'en production, puis
  # démarre l'application : /actuator/health ne répond UP qu'une fois Flyway passé
  # et ddl-auto=validate satisfait. Une migration cassée, ou une entité sans
  # script correspondant, échoue donc ici et non au déploiement sur Render.
  migrations:
    name: Migrations Flyway sur PostgreSQL
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: gescom_ci
          POSTGRES_USER: gescom
          POSTGRES_PASSWORD: gescom
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gescom -d gescom_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Installer le JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Construire le jar
        run: ./mvnw -B -q clean package -DskipTests

      - name: Jouer les migrations et démarrer l'application
        env:
          DB_URL: jdbc:postgresql://localhost:5432/gescom_ci
          DB_USERNAME: gescom
          DB_PASSWORD: gescom
        run: |
          java -jar target/gescom-backend-*.jar > app.log 2>&1 &
          APP=$!
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8085/actuator/health > /dev/null; then
              echo "Application démarrée, migrations appliquées."
              kill $APP
              exit 0
            fi
            kill -0 $APP 2> /dev/null || break
            sleep 2
          done
          cat app.log
          exit 1

  # La version de l'application est déclarée dans le pom ; le package.json du SPA
  # doit porter la même. Sans ce contrôle, les deux divergent sans que personne
  # ne s'en aperçoive (le front est longtemps resté en 0.0.0).
  version:
    name: Cohérence des versions
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Comparer pom.xml et FRONT/package.json
        run: |
          POM=$(sed -n '/<artifactId>gescom-backend<\/artifactId>/,/<version>/s:.*<version>\(.*\)</version>.*:\1:p' pom.xml)
          FRONT=$(node -p "require('./FRONT/package.json').version")
          echo "pom.xml : $POM / FRONT/package.json : $FRONT"
          echo "$POM" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "Version du pom non SemVer"; exit 1; }
          [ "$POM" = "$FRONT" ] || { echo "Versions divergentes"; exit 1; }

  frontend:
    name: SPA - lint, i18n et build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FRONT

    steps:
      - uses: actions/checkout@v4

      # Node 24 et non la version par défaut : @zxing/library, tiré par le scanner
      # de codes-barres, déclare engines.node >= 24. Même version que le Dockerfile
      # et que render.yaml - les trois doivent rester alignés.
      - name: Installer Node 24
        uses: actions/setup-node@v4
        with:
          node-version-file: FRONT/.nvmrc
          cache: npm
          cache-dependency-path: FRONT/package-lock.json

      # `npm ci` et non `npm install` : l'installation suit strictement le
      # package-lock.json, aucune dépendance n'est promue en cours de route.
      - name: Installer les dépendances
        run: npm ci

      - name: Lint
        run: npm run lint

      # Le contrôle i18n mérite sa propre étape : une clé manquante dans une des
      # trois langues casse l'écran pour ses seuls utilisateurs, ce qu'un build
      # réussi ne révèle jamais.
      - name: Vérifier les traductions
        run: npm run check:i18n

      - name: Construire le SPA
        run: npm run build
