# ==============================================================================
# PROFIL RENDER
#
# Surcouche appliquée par-dessus application.properties, jamais à sa place :
# Spring charge toujours le fichier de base, puis écrase avec celui du profil
# actif. Ne figure donc ici que ce qui diffère réellement d'une exécution
# locale — le port d'écoute et la façon de joindre la base.
#
# Tout le reste (Flyway, ddl-auto=validate, JWT, pagination, i18n, Stripe) est
# hérité tel quel. En particulier le schéma reste la propriété des migrations :
# aucun ddl-auto=update ici, sans quoi Hibernate créerait les tables lui-même et
# les données de référence des scripts V<n>_2__insert ne seraient jamais posées.
#
# Aucune valeur de repli sur les identifiants de base : un secret écrit dans un
# fichier versionné est un secret publié. Ils viennent des variables injectées
# par render.yaml depuis la base managée, et l'application refuse de démarrer si
# elles manquent — c'est le comportement voulu.
# ==============================================================================

# Render attribue le port d'écoute au démarrage et route le trafic dessus ;
# rester sur 8085 rendrait le service injoignable. Le repli ne sert qu'à lancer
# le profil hors de la plateforme, pour vérification.
server.port=${PORT:8085}

# ------------------------------------------------------------------------------
# Base de données
#
# Mêmes variables qu'en local, mais redéclarées ici sans valeur de repli : celles
# d'application.properties pointent sur localhost, et une variable oubliée ferait
# alors chercher une base sur le conteneur lui-même — l'échec se lirait comme une
# panne de la base plutôt que comme une configuration incomplète.
#
# La valeur de DB_URL est une URL JDBC, pas l'URL de connexion PostgreSQL que
# Render affiche par défaut : voir render.yaml, qui la fait saisir à la création
# du blueprint et documente comment la composer (sslmode=require compris, les
# bases managées refusant les connexions en clair).
# ------------------------------------------------------------------------------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Le pool est dimensionné pour l'offre managée, pas pour la machine : les
# formules d'entrée de gamme plafonnent le nombre de connexions simultanées, et
# un pool trop large les épuise dès le second conteneur — un déploiement, qui
# fait cohabiter l'ancienne et la nouvelle instance, suffit à y arriver.
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# Les instances gérées par la plateforme sont recyclées sans préavis : une fuite
# de connexion ne se voit pas dans un redémarrage, seulement dans le journal.
spring.datasource.hikari.leak-detection-threshold=60000

# ------------------------------------------------------------------------------
# Écritures groupées
#
# La base est jointe par le réseau et non par une boucle locale : chaque
# aller-retour coûte, et les insertions de lignes de commande ou de mouvements
# de stock se font par paquets. order_inserts/order_updates regroupent les
# instructions par table, sans quoi le lot est rompu à chaque changement.
# ------------------------------------------------------------------------------
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Les fichiers déposés ne survivent pas au redéploiement : le disque du
# conteneur est éphémère. /tmp est le seul emplacement inscriptible par
# l'utilisateur non privilégié de l'image.
spring.servlet.multipart.location=/tmp
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
