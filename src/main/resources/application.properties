# ===============================
# APPLICATION SETTINGS
# ===============================
spring.application.name=commercial-app
server.port=8085

server.servlet.context-path=/

# Configuration PostgreSQL
# Les URLs/users peuvent avoir un défaut pour le développement local, mais le mot de passe
# doit toujours être fourni via la variable d'environnement DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/GESCOM_2}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate pour PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# JWT Configuration
# Le secret JWT doit impérativement être fourni via la variable d'environnement JWT_SECRET.
# Aucun fallback: si la variable n'est pas définie, l'application refusera de démarrer.
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Logging
logging.level.com.gescom.backend=INFO
logging.level.org.springframework.security=WARN

# CORS Configuration
cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

# Internationalization
spring.messages.basename=i18n/messages
spring.messages.encoding=UTF-8

