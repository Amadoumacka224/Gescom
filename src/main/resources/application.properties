# ===============================
# APPLICATION SETTINGS
# ===============================
spring.application.name=commercial-app
server.port=8085

server.servlet.context-path=/

# Configuration PostgreSQL
# Les valeurs ci-dessous sont des fallbacks pour le développement local uniquement.
# En production, surcharger via les variables d'environnement DB_URL, DB_USERNAME, DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/GESCOM_2}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:passer}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate pour PostgreSQL
# ddl-auto=validate et non plus update : le schema appartient desormais aux migrations
# Flyway, Hibernate se contente de verifier au demarrage que les entites correspondent
# a ce qui est en base. Une entite modifiee sans migration fait echouer le demarrage —
# c'est voulu, c'est le filet qui remplace la modification silencieuse du schema.
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ===============================
# FLYWAY (MIGRATIONS DE SCHEMA)
# ===============================
# Les scripts vivent dans src/main/resources/db/migration et sont nommes V<n>__<libelle>.sql.
# baseline-on-migrate : les bases deja en service (GESCOM_2 et consorts) contiennent deja le
# schema sans avoir de table d'historique ; Flyway les marque au niveau baseline-version au
# lieu de rejouer les scripts et d'echouer sur des tables existantes. Le declenchement est
# conditionne au schema NON VIDE : sur une base vierge, les 28 scripts sont joues normalement.
#
# baseline-version doit couvrir le dernier script deja present en base, sinon Flyway rejoue
# tout ce qui la depasse. Attention au parsing des versions : le _ des noms V<n>_<k>__ est un
# separateur de version, V1_1 vaut donc 1.1 et non 1. Avec baseline-version=1, 1.1 > 1 : la
# base etait bien marquee, puis V1_1 etait rejoue et echouait sur « relation users existe
# deja ». Le demarrage etait impossible sur toute base deja peuplee, et la seule issue —
# repartir d'une base vide — detruisait les donnees d'exploitation a chaque redemarrage.
# 14.2 est la version du dernier script : toute base portant le schema complet est reconnue
# comme a jour. Un nouveau V15_1 reste joue par-dessus, sur base baselinee comme sur base neuve.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=14.2

# Le projet numerote ses migrations par table (V<n>_1__create / V<n>_2__insert) et non par
# ordre chronologique. Une paire completee apres coup arrive donc avec une version
# inferieure a celle deja appliquee : le seed V21_2 est ecrit alors que V22_1 est en base.
# Sans ce reglage, Flyway refuse ce cas au demarrage — « Detected resolved migration not
# applied to database » — et l'application ne demarre plus.
#
# Le risque assume est celui de tout out-of-order : un script insere dans le passe n'est
# joue que sur les bases qui ne l'ont pas encore vu, jamais rejoue sur celles a jour. Il ne
# doit donc contenir aucune modification de schema dependant d'un etat posterieur.
spring.flyway.out-of-order=true

# JWT Configuration
# Le fallback ci-dessous est UNIQUEMENT pour le développement local.
# En production, surcharger impérativement via la variable d'environnement JWT_SECRET
# avec une valeur aléatoire de 64 caractères minimum.
jwt.secret=${JWT_SECRET:dev-only-not-secure-replace-in-production-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Compte propriétaire de la plateforme (back-office SaaS)
# Créé au premier démarrage par PlatformAdminBootstrap, puis jamais réécrit.
# Sans ces trois variables, aucun compte n'est créé et l'application démarre normalement.
# Volontairement sans valeur de repli : un identifiant propriétaire par défaut, versionné
# et identique sur toutes les installations, ne serait jamais changé.
platform.admin.username=${PLATFORM_ADMIN_USERNAME:}
platform.admin.email=${PLATFORM_ADMIN_EMAIL:}
platform.admin.password=${PLATFORM_ADMIN_PASSWORD:}

# Logging
logging.level.com.gescom.backend=INFO
logging.level.org.springframework.security=WARN

# CORS Configuration
cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

# Internationalization
spring.messages.basename=i18n/messages
spring.messages.encoding=UTF-8

# ===============================
# PAGINATION
# ===============================
# Ne concerne que les registres à croissance non bornée (journal d'activité, mouvements de
# stock) ; les autres listes restent renvoyées en entier. Le plafond est là pour qu'un
# ?size=999999 ne contourne pas la pagination.
spring.data.web.pageable.default-page-size=50
spring.data.web.pageable.max-page-size=200

# ===============================
# STRIPE (MODE TEST UNIQUEMENT)
# ===============================
# Deux modes, même API REST côté application :
#   simulated (défaut) — aucun appel réseau, les intentions de paiement sont générées en local.
#                        Permet de dérouler le parcours complet sans compte Stripe.
#   api               — appels réels vers l'environnement de test Stripe (api.stripe.com).
#                        Exige une clé secrète de test : STRIPE_API_KEY=sk_test_...
# La clé par défaut est volontairement factice : elle ne fonctionne qu'en mode simulé, et
# aucune clé live (sk_live_) n'est acceptée — voir StripeProperties.
stripe.mode=${STRIPE_MODE:simulated}
stripe.api-key=${STRIPE_API_KEY:sk_test_fictive_key_for_simulation}
stripe.currency=${STRIPE_CURRENCY:eur}

