# ==============================================================================
# GESCOM — plan d'infrastructure Render
#
# Décrit les deux services — l'API et le SPA — et la base. Render lit ce fichier
# à la création du blueprint puis à chaque modification poussée sur la branche
# suivie.
#
# Ce déploiement est une alternative à docker-compose.yml, pas un complément :
# l'un met l'application chez un hébergeur managé qui fournit le certificat et
# le routage, l'autre la met sur une machine que l'on administre soi-même avec
# Caddy en frontal. Les deux construisent la même image d'API.
#
# Différence structurante entre les deux : sous docker-compose, Caddy sert le SPA
# et relaie /api sous un seul et même domaine — aucune requête inter-origines.
# Ici, le SPA est un service statique publié sous SON propre domaine, distinct de
# celui de l'API. Deux conséquences dont ni l'une ni l'autre n'est facultative :
# le front doit être construit avec VITE_API_URL pointant sur l'API en absolu,
# sinon ses appels partent en relatif vers l'hôte statique et font 404 ; et
# l'API doit déclarer le domaine du front dans CORS_ORIGINS, sinon le navigateur
# refuse les réponses. La cible `web` du Dockerfile (Caddy) n'est donc pas
# utilisée ici : elle appartient au déploiement docker-compose.
# ==============================================================================

services:
  - type: web
    name: gescom-app

    # `runtime` et non `env`, qui est le nom déprécié du même champ.
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .

    # Render ne sait pas construire une étape intermédiaire d'un Dockerfile
    # multi-étapes : il n'existe pas d'équivalent de `--target`, la dernière
    # étape du fichier est toujours celle qui est déployée. C'est la raison pour
    # laquelle l'API est écrite en dernier dans le Dockerfile — voir le
    # commentaire d'en-tête de celui-ci avant d'en réordonner les étapes.

    region: oregon
    plan: starter

    # L'application écoute sur $PORT, injecté par Render (voir le profil render).
    # Le service n'est mis en rotation qu'une fois cette sonde satisfaite : elle
    # ne répond qu'après le rafraîchissement du contexte Spring, donc après les
    # migrations Flyway. Un déploiement dont le schéma n'a pas migré ne reçoit
    # jamais de trafic, et l'instance précédente reste en place.
    healthCheckPath: /actuator/health

    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: render

      # ------------------------------------------------------------------------
      # Base de données
      #
      # DB_URL n'est pas dérivable de la base : `fromDatabase` n'expose que
      # connectionString, connectionPoolString, user, password et database — ni
      # hôte ni port — et connectionString est une URL de connexion PostgreSQL
      # (postgresql://…), que le pilote JDBC rejette.
      #
      # `sync: false` fait donc demander la valeur à la création du blueprint,
      # sans la faire figurer dans le dépôt. La composer à partir de l'onglet
      # Connect de la base, en reprenant l'hôte interne :
      #
      #   jdbc:postgresql://<hôte-interne>:5432/gescom_k7fn?sslmode=require
      #
      # L'identifiant et le mot de passe, eux, viennent bien de la base : ils
      # suivent automatiquement une rotation côté Render.
      # ------------------------------------------------------------------------
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        fromDatabase:
          name: gescom-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: gescom-db
          property: password

      # Secret de signature des jetons, tiré une fois par Render et conservé
      # d'un déploiement à l'autre. Le régénérer invaliderait toutes les
      # sessions en cours.
      - key: JWT_SECRET
        generateValue: true

      # Origine autorisée à appeler l'API depuis un navigateur : celle du service
      # statique `gescom-front` déclaré plus bas, schéma compris et sans barre
      # oblique finale — par exemple https://gescom-front.onrender.com.
      #
      # Demandée à la création plutôt que dérivée du service : `fromService` avec
      # la propriété `host` ne rend que le nom d'hôte, sans schéma, et
      # SecurityConfig passe la valeur telle quelle à setAllowedOrigins, qui
      # exige une origine complète.
      - key: CORS_ORIGINS
        sync: false

      # ------------------------------------------------------------------------
      # Compte propriétaire de la plateforme, créé au premier démarrage par
      # PlatformAdminBootstrap puis jamais réécrit. Renseigné à la main : un
      # mot de passe engendré par la plateforme resterait illisible pour son
      # titulaire, et ces identifiants ouvrent le back-office SaaS complet.
      # Les omettre est un choix valable — aucun compte n'est alors créé.
      # ------------------------------------------------------------------------
      - key: PLATFORM_ADMIN_USERNAME
        sync: false
      - key: PLATFORM_ADMIN_EMAIL
        sync: false
      - key: PLATFORM_ADMIN_PASSWORD
        sync: false

      # Aucune clé Stripe réelle n'est déployée : le mode simulé génère les
      # intentions de paiement localement et ne sort pas sur le réseau.
      - key: STRIPE_MODE
        value: simulated

  # ----------------------------------------------------------------------------
  # SPA — service statique
  #
  # Pas de conteneur : Render exécute la commande de construction puis sert le
  # contenu de staticPublishPath depuis son réseau de diffusion.
  #
  # Node 24 et non la version par défaut de la plateforme : @zxing/library, tiré
  # par le scanner de codes-barres, déclare engines.node >= 24 — même raison que
  # dans le Dockerfile, à garder alignée avec lui.
  # ----------------------------------------------------------------------------
  - type: web
    name: gescom-front
    runtime: static

    buildCommand: cd FRONT && npm ci && npm run build
    staticPublishPath: FRONT/dist

    envVars:
      - key: NODE_VERSION
        value: "24"

      # Sans cette variable, src/services/axios.js retombe sur '/api' en relatif,
      # qui viserait l'hôte statique et non l'API : toutes les requêtes feraient
      # 404. Elle est lue à la construction, pas à l'exécution — la modifier
      # impose donc de reconstruire le service, pas seulement de le redémarrer.
      # Valeur attendue : https://<hôte de gescom-app>/api
      - key: VITE_API_URL
        sync: false

    # Même politique de sécurité du contenu que sous docker-compose, où elle est
    # posée par Caddy — voir le bloc `header` du Caddyfile pour le détail de
    # chaque directive.
    #
    # Une seule diffère, et c'est la conséquence directe du découpage décrit en
    # tête de fichier : ici le SPA et l'API sont sur deux domaines distincts, si
    # bien qu'un connect-src 'self' couperait tous les appels métier. L'origine
    # de l'API doit donc y figurer en toutes lettres. Elle ne peut pas être
    # dérivée de VITE_API_URL — un blueprint n'interpole pas de variable dans la
    # valeur d'un en-tête —, d'où la valeur écrite en dur ci-dessous : à tenir
    # alignée sur l'hôte réel du service gescom-app, et à remplacer si celui-ci
    # est publié sous un domaine personnalisé.
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://gescom-app.onrender.com; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

    # Le routage d'une application à page unique est côté navigateur : une URL
    # comme /platform/companies ne correspond à aucun fichier. Sans cette
    # réécriture, un rechargement ou un lien direct renvoie 404 au lieu de
    # laisser React Router résoudre la route.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

# ------------------------------------------------------------------------------
# Base PostgreSQL managée.
#
# L'offre `free` est supprimée par Render au bout d'un mois, sans sauvegarde
# conservée. Elle convient à une démonstration, pas à une installation qui doit
# garder ses données : passer à `starter` avant toute mise en service réelle.
# ------------------------------------------------------------------------------
databases:
  - name: gescom-db
    databaseName: gescom_k7fn
    user: gescom_k7fn_user
    region: oregon
    plan: free
